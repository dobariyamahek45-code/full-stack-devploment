<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- font awsome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="media.css">

</head>

<body>
    <header>
        <div class="conatiner">
            <div class="row">
                <div class="col-6">
                    <div class="logo">
                        <ul>
                            <h1><i class="fa-solid fa-bed"></i>Logo</h1>
                            <li><a href="">Rooms</a></li>
                            <li><a href="">About</a></li>
                            <li><a href="">Contact</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-6">
                    <div class="menu">
                        <p>Book now</p>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="main">
        <!-- hero section -->
        <section class="hero-section">
            <div class="container">
                <div class="row">
                    <div class="col-12">
                        <div class="image-section">
                            <img src="https://www.w3schools.com/w3images/hotel.jpg" alt="">
                        </div>
                    </div>
                    <div class="hero-contant">
                        <h2><i class="fa-solid fa-bed"></i>Hotel Name</h2>
                        <div class="form-section">
                            <form>
                                <div class="row">

                                    <div class="col-6">
                                        <label><i class="fa-regular fa-calendar"></i> Check In</label>
                                        <input type="text" placeholder="DD MM YYYY">
                                    </div>

                                    <div class="col-6">
                                        <label><i class="fa-regular fa-calendar"></i> Check Out</label>
                                        <input type="text" placeholder="DD MM YYYY">
                                    </div>

                                     <div class="col-6">
                                        <label><i class="fa fa-male"></i>Adults</label>
                                        <input type="number" value="1" min="1" max="6">
                                    </div>

                                    <div class="col-6">
                                        <label> <i class="fa-solid fa-child"></i>Kids</label>
                                        <input type="number" value="0" min="0" max="6">
                                    </div>

                                    <button><i class="fa-solid fa-magnifying-glass"></i>Search availability</button>
                                    </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

</body>

</html>

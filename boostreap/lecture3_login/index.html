<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>
    <!-- Bootstrap CSS -->
    <link href="./asstes/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./asstes/css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-lg-4">

                <div class="login-box">


                    <div class="select mb-4 mt-3">
                        <select class="form-select form-select-xs">
                            <option>English</option>
                            <option>Hindi</option>
                            <option>Gujarati</option>
                        </select>

                    </div>
                    <div class="text-center mb-5">

                        <h1 class="logo">Instagram</h1>

                    </div>
                    <div class="d-grid">

                        <button class="btn btn-primary">

                            <i class="fa-brands fa-facebook-f"></i>

                            Continue with Facebook

                        </button>

                    </div>
                    <div class="or-section d-flex justify-content-center m-3">
                        <span class="text-center">OR</span>
                    </div>

                    <div class="mb-3">

                        <input type="text" class="form-control" placeholder="Phone number, username or email">

                    </div>
                    <div class="mb-3">

                        <input type="password" class="form-control" placeholder="Password">

                    </div>
                    <div class="text-end mb-4">

                        <a href="#">Forgot password?</a>

                    </div>
                    <div class="d-grid">

                        <button class="btn btn-primary text-white">

                            Log In

                        </button>

                    </div>
                    <div class="text-center mt-4">

                        Don't have an account?

                        <a href="#">Sign up</a>

                    </div>
                </div>

            </div>



        </div>

    </div>

    <div class="footer">

        <p>from</p>

        <h5>FACEBOOK</h5>

    </div>

    <script src="./asstes/js/bootstrap.bundle.js"></script>
</body>

</html>

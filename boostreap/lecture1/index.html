<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>

    <div class="container text-center mt-5 ">
        <div class="row">
            <div class="col bg-primary py-3">
                Column
            </div>
            <div class="col bg-success py-3">
                Column
            </div>
            <div class="col bg-dark text-white py-3">
                Column
            </div>
        </div>
        <div class="row ">
            <div class="col bg-dark text-white py-3 mt-3">
                1 of 2
            </div>
            <div class="col bg-danger text-white py-3 mt-3">
                2 of 2
            </div>
        </div>
        <div class="row ">
            <div class="col bg-danger text-white py-3 mt-3 ">
                1 of 3
            </div>
            <div class="col bg-dark text-white py-3 mt-3 ">
                2 of 3
            </div>
            <div class="col bg-info text-white py-3 mt-3 ">
                3 of 3
            </div>
            <div class="container text-center">
                <div class="row">
                    <div class="col-sm-8">col-sm-8</div>
                    <div class="col-sm-4">col-sm-4</div>
                </div>
                <div class="row">
                    <div class="col-sm">col-sm</div>
                    <div class="col-sm">col-sm</div>
                    <div class="col-sm">col-sm</div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</body>

</html>

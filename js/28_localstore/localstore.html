<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    color: #263248;
    padding: 50px 20px;
}

.container {
    max-width: 950px;
    margin: auto;
    background: #ffffff;
    border-radius: 15px;
    padding: 35px;
    box-shadow: 0 8px 35px rgba(36, 55, 90, 0.12);
}

h2 {
    font-size: 25px;
    color: #1e3a8a;
    margin-bottom: 25px;
    padding-bottom: 12px;
    border-bottom: 2px solid #e5eaf3;
}

form {
    max-width: 600px;
    margin: 0 auto 30px;
    background: #f8faff;
    border: 1px solid #e0e7f2;
    border-radius: 12px;
    padding: 25px;
}

form p {
    margin-bottom: 20px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #334155;
}

input[type="text"] {
    width: 100%;
    height: 45px;
    padding: 0 14px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    background: #ffffff;
    font-size: 15px;
    outline: none;
    transition: 0.25s;
}

input[type="text"]:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.save-btn {
    display: block;
    width: 100%;
    height: 46px;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.25s;
}

.save-btn:hover {
    background: #1d4ed8;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

hr {
    border: none;
    border-top: 1px solid #e2e8f0;
    margin: 30px 0;
}

.users-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    background: white;
}

.users-table th {
    background: #1e3a8a;
    color: white;
    padding: 16px 12px;
    text-align: left;
    font-size: 14px;
    font-weight: 600;
}

.users-table td {
    padding: 15px 12px;
    border-bottom: 1px solid #e8edf5;
    text-align: left;
    font-size: 14px;
}

.users-table tbody tr:nth-child(even) {
    background: #f8faff;
}

.users-table tbody tr:hover {
    background: #edf4ff;
}

.users-table tbody tr:last-child td {
    border-bottom: none;
}

@media (max-width: 600px) {
    body {
        padding: 15px 8px;
    }

    .container {
        padding: 20px 12px;
    }

    form {
        padding: 16px;
    }

    .users-table th,
    .users-table td {
        padding: 10px 6px;
        font-size: 12px;
    }
}
    </style>
</head>
<body>
    <div align="center">
        <h2>Add Users</h2>
        <form>
            <input type="hidden" id="editid">
            <p>
                <label for="name">Name :- </label>
                <input type="text" id="name" placeholder="Enter name">
            </p>
             <p>
                <label for="course">course :- </label>
                <input type="text" id="course" placeholder="Enter course">
            </p>
            <p>
                <input type="button" onclick="saveRecord()" value="button">
            </p>
        </form>

        <hr>
        <h2>View Users</h2>
        <table border="1" width="50%">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>course</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="usersrecord"></tbody>
        </table>
    </div>
    <script src="./localstore.js"></script>
</body>
</html>

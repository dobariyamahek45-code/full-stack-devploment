<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
          
        }

        .box {
            width: 350px;
            padding: 50px;
            background-color: #b48fd8;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.30);
        }

        .counter h2 {
            font-size: 25px;
            color: #8f1bd2;
            margin-bottom: 25px;
        }

        .count {
            font-size: 55px;
            color: #9e72ca;
            margin-bottom: 30px;
        }

        button {
            width: 65px;
            height: 55px;
            border: none;
            border-radius: 15px;
            margin: 5px;
            font-size: 25px;
            font-weight: bold;
            background-color: #9e72ca;
            color: rgb(249, 41, 221);
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        .plus {
            background: #28a745;
        }

        .minus {
            background: #dc3545;
        }

        .reset {
            background: #ff9800;
        }

        .plus:hover {
            background: #218838;
        }

        .minus:hover {
            background: #c82333;
        }

        .reset:hover {
            background: #e68900;
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="counter">
            <h2 id="counter">count:0</h2>
            <button onclick="increment()">+</button>
            <button onclick="decrement()">-</button>
            <button onclick="reset()">R</button>
        </div>
    </div>
    
    <script>
        let no=0;

        const updateCount =(no)=>{
            document.getElementById("counter").innerHTML=`count:   ${no}`
        }    
        updateCount(no)

        const increment =()=>{
            no++;
            updateCount(no)
        }      

         const decrement =()=>{
            no--;
            updateCount(no)
        }      

         const reset =()=>{
            no=0;
            updateCount(no)
        }      
        </script>
</body>

</html>

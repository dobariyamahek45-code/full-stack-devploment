<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let grade=Number(prompt("enter your makes"))
        if(grade>=90){
            document.write(`grade A+`)
        }else if(grade>=80){
            document.write(`grade A`)
        }else if(grade>=70){
            document.write(`grade B`)
        }else if(grade>=60){
            document.write(`grade c`)
        }else if(grade>=50){
            document.write(`grade D`)
        }else{
            document.write(`fali`)
        }
    </script>
</body>
</html>

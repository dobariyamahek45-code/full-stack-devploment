<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = 12;   
        let num2 = 4;   
        let operator = "/";  
switch(operator) {
    case "+":
    document.write(`Result = ` + (num1 + num2));
    break;

    case "-":
    document.write("Result = " + (num1 - num2));
    break;
    
    case "*":
    document.write("Result = " + (num1 * num2));
    break;

    case "/":
     document.write("Result = " + (num1 / num2));
    break;

    default:
    document.write ("Invalid operator! Please enter +, -, *, or /");
}

    </script>
</body>
</html>

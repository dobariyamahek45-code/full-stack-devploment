<body>
    <script>
        let num=Number(prompt("enter a number"))
        if(num%3==0 || num%5==0){
            document.write(`3 is divisable`)
        }else{
            if(num%5==0){
             document.write(`5 is divisable`)
        }else{
            document.write(`3&5  is not divisable`)
        }
    }
    </script>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let ch = prompt("Enter a character")
    if (ch === "a" || ch === "e" || ch === "i" || ch === "o" || ch === "u") {
        document.write(`Vowel character`);
    } else {
        document.write(`Consonant character`);
    }

    </script>
</body>
</html>

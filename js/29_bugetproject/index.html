
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./index.css">
    

</head>
<body>

    <h3>Expense Tracker Using JavaScript</h3>

    <div class="balance-box">
        <h2>✔ Balance: <span id="balance">1000</span></h2>

        <div class="summary">
            <div>
                <p>Total Income:</p>
                <h3 id="income">1000</h3>
            </div>

            <div class="line"></div>

            <div>
                <p>Total Expenses:</p>
                <h3 id="expenses">2000</h3>
            </div>
        </div>
    </div>

    <div class="main-container">

        <div class="expense-section">
            <h2>Expenses</h2>

            <table>
                <thead>
                    <tr>
                        <th>sr.no</th>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="record"></tbody>
            </table>
        </div>

        <div class="form-section">
            <h2>Add new</h2>

            <form>
                <p>
                    <label for="type">Entry type:</label>
                    <select id="type">
                        <option value="Expense">Expense</option>
                        <option value="Income">Income</option>
                    </select>
                </p>

                <p>
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="name" required>
                </p>

                <p>
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" placeholder="0" min="1" required>
                </p>

                <input type="hidden" id="editid">

                <button type="button" id="submit-btn" onclick="saverecord()">
                    Add Expense
                </button>
            </form>
        </div>

    </div>

    <script src="./index.js"></script>
</body>
</html>

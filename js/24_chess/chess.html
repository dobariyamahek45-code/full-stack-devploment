<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         .white{
            width: 75px;
            height: 75px;
            background-color: burlywood;
        }
        .black{
             width: 75px;
            height: 75px;
            background-color: black;
        }
    </style>
</head>
<body>
     <div align="center">
        <table id="chess" border="1">

        </table>
    </div>


    <script>
        let chess = document.getElementById('chess')

        for(let i=1;i<=8;i++){
            let tr = document.createElement('tr')

            if(i%2==0){
                for(let j=1;j<=8;j++){
                    if(j%2==1){
                         let td = document.createElement('td');
                        td.setAttribute('class','white')
                        tr.appendChild(td)
                     }else{
                         let td = document.createElement('td');
                        td.setAttribute('class','black')
                        tr.appendChild(td)
                     }
                   
                }
            }else{
                for(let j=1;j<=8;j++){
                    if(j%2==1){
                         let td = document.createElement('td');
                        td.setAttribute('class','black')
                        tr.appendChild(td)
                     }else{
                         let td = document.createElement('td');
                        td.setAttribute('class','white')
                        tr.appendChild(td)
                     }
                   
                }
             }

                

            chess.appendChild(tr);
        }

    </script>
</body>
</html>
